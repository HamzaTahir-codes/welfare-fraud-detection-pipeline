[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks", "data", "airflow/logs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  "E712",  # `df[col] == False` is an element-wise pandas comparison; `not df[col]` would be wrong
  "B905",  # zip() without strict=; lengths are equal by construction throughout
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# transform_stage.py does `from extract_stage import ...`, so src/etl must be importable too
pythonpath = [".", "src/etl"]
# only test_*.py; tests/publish_test.py is a standalone script that needs a published snapshot
python_files = ["test_*.py"]
