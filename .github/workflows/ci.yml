name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-airflow.txt
      - name: Install dependencies
        # The pipeline's core libraries plus the dashboard's (pinned as in requirements.txt) for the AppTest page tests.
        run: pip install -r requirements-airflow.txt psycopg2-binary streamlit==1.62.0 plotly==7.0.0 pytest ruff
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        run: pytest -q
