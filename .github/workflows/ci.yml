name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-airflow.txt
      - name: Install dependencies
        # The unit tests only need the pipeline's core libraries, not the full local freeze.
        run: pip install -r requirements-airflow.txt psycopg2-binary pytest ruff
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        run: pytest -q
