<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Ghost Beneficiary Detection Pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0d0a24"/>
      <stop offset="1" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowHub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#fb7185" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="440" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#dots)"/>
    <rect width="1280" height="440" fill="url(#glowTeal)"/>
    <circle cx="1010" cy="215" r="330" fill="url(#glowViolet)"/>
    <circle cx="1010" cy="215" r="170" fill="url(#glowHub)"/>

    <!-- scanning rings around the hub account -->
    <g fill="none" stroke="#fb7185">
      <circle cx="1010" cy="215" r="60"  stroke-opacity="0.55" stroke-width="1.5"/>
      <circle cx="1010" cy="215" r="105" stroke-opacity="0.28" stroke-width="1.2" stroke-dasharray="4 8"/>
      <circle cx="1010" cy="215" r="160" stroke-opacity="0.16" stroke-width="1"/>
    </g>

    <!-- edges: ghost identities funnelling into ONE bank account -->
    <g stroke="#fb7185" stroke-opacity="0.75" stroke-width="1.6" stroke-linecap="round">
      <line x1="1010" y1="215" x2="905" y2="112"/>
      <line x1="1010" y1="215" x2="1128" y2="98"/>
      <line x1="1010" y1="215" x2="1178" y2="228"/>
      <line x1="1010" y1="215" x2="1118" y2="338"/>
      <line x1="1010" y1="215" x2="892" y2="330"/>
      <line x1="1010" y1="215" x2="850" y2="222"/>
    </g>

    <!-- faint edges between legitimate beneficiaries -->
    <g stroke="#22d3ee" stroke-opacity="0.16" stroke-width="1.2">
      <line x1="700" y1="70"  x2="780" y2="120"/>
      <line x1="780" y1="120" x2="850" y2="60"/>
      <line x1="780" y1="120" x2="808" y2="196"/>
      <line x1="700" y1="380" x2="790" y2="352"/>
      <line x1="790" y1="352" x2="892" y2="330"/>
      <line x1="1215" y1="60" x2="1128" y2="98"/>
      <line x1="1226" y1="372" x2="1118" y2="338"/>
      <line x1="1010" y1="30" x2="1128" y2="98"/>
      <line x1="1010" y1="30" x2="905" y2="112"/>
    </g>

    <!-- legitimate beneficiaries -->
    <g fill="#22d3ee">
      <circle cx="700" cy="70" r="6" fill-opacity="0.75"/>
      <circle cx="780" cy="120" r="7" fill-opacity="0.85"/>
      <circle cx="850" cy="60" r="5" fill-opacity="0.6"/>
      <circle cx="808" cy="196" r="5" fill-opacity="0.6"/>
      <circle cx="700" cy="380" r="6" fill-opacity="0.7"/>
      <circle cx="790" cy="352" r="6" fill-opacity="0.8"/>
      <circle cx="1215" cy="60" r="5" fill-opacity="0.6"/>
      <circle cx="1226" cy="372" r="6" fill-opacity="0.7"/>
      <circle cx="1010" cy="30" r="5" fill-opacity="0.6"/>
    </g>

    <!-- ghost beneficiaries (dashed, hollow) -->
    <g fill="#0d0a24" stroke="#fb7185" stroke-width="2" stroke-dasharray="3 3">
      <circle cx="905"  cy="112" r="15"/>
      <circle cx="1128" cy="98"  r="15"/>
      <circle cx="1178" cy="228" r="15"/>
      <circle cx="1118" cy="338" r="15"/>
      <circle cx="892"  cy="330" r="15"/>
      <circle cx="850"  cy="222" r="15"/>
    </g>
    <g fill="#fb7185" fill-opacity="0.9">
      <circle cx="905"  cy="112" r="4.5"/>
      <circle cx="1128" cy="98"  r="4.5"/>
      <circle cx="1178" cy="228" r="4.5"/>
      <circle cx="1118" cy="338" r="4.5"/>
      <circle cx="892"  cy="330" r="4.5"/>
      <circle cx="850"  cy="222" r="4.5"/>
    </g>

    <!-- the hub bank account -->
    <circle cx="1010" cy="215" r="30" fill="#fb7185" fill-opacity="0.18"/>
    <circle cx="1010" cy="215" r="20" fill="#fb7185"/>
    <circle cx="1010" cy="215" r="8" fill="#fff" fill-opacity="0.95"/>

    <!-- left: text -->
    <rect x="72" y="74" width="46" height="4" rx="2" fill="url(#bar)"/>
    <text x="72" y="108" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#22d3ee">DATA ENGINEERING  ·  FRAUD ANALYTICS</text>

    <text x="70" y="188" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="66" font-weight="800" fill="#ffffff">Ghost Beneficiary</text>
    <text x="70" y="262" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="66" font-weight="800" fill="url(#title)">Detection Pipeline</text>

    <text x="72" y="304" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#a5b0cf">Multi-source ETL  →  three fraud detectors  →  one honest scoreboard</text>

    <!-- chips -->
    <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#dbe4ff">
      <rect x="72"  y="338" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="128" y="360" text-anchor="middle">PostgreSQL</text>
      <rect x="196" y="338" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="262" y="360" text-anchor="middle">Apache Airflow</text>
      <rect x="340" y="338" width="108" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="394" y="360" text-anchor="middle">Streamlit</text>
      <rect x="460" y="338" width="122" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="521" y="360" text-anchor="middle">scikit-learn</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
</svg>
